# Scheduled NSE EOD snapshot update.
#
# PUT THIS FILE AT:  .github/workflows/daily-nse-update.yml
#
# CAVEAT YOU MUST READ FIRST
# --------------------------
# NSE blocks datacentre IP ranges. GitHub Actions runners are Azure
# datacentre IPs. This workflow may work, or NSE may refuse the runner with
# 401/403. It is NOT guaranteed. Run it manually once (Actions tab ->
# Run workflow) before trusting the schedule. If it fails on IP grounds,
# use the local Task Scheduler / cron path instead — that runs from your
# own broadband, which NSE does not block.
#
# The job deliberately fails loudly rather than committing stale data, so a
# red X in the Actions tab means "the snapshot did not advance", not
# "something cosmetic broke".

name: Daily NSE EOD update

on:
  schedule:
    # 15:30 UTC = 21:00 IST, Mon-Fri.
    # NSE closes 15:30 IST; the UDiFF bhavcopy publishes around 20:00 IST,
    # so 21:00 IST leaves an hour of margin.
    - cron: "30 15 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # required for the bot to push the snapshot

concurrency:
  group: nse-eod-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests pandas

      - name: Fetch, prune, commit, push
        id: update
        run: python auto_update.py --window 400 --skip-mcap
        continue-on-error: true

      - name: Refresh market cap (Mondays only)
        # Market cap is ~150 sequential NSE calls. Weekly is enough for a
        # figure that moves with price anyway.
        if: github.event_name == 'workflow_dispatch' || fromJSON('true')
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python auto_update.py --window 400 --no-push || true
            git push || true
          else
            echo "Not Monday — skipping market cap refresh"
          fi
        continue-on-error: true

      - name: Report result
        run: |
          echo "## NSE snapshot" >> "$GITHUB_STEP_SUMMARY"
          if [ -f nse_meta.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("nse_meta.json"))
          print(f"- built: `{m.get('built_at')}`")
          print(f"- latest index close: `{m.get('latest_index_date')}`")
          print(f"- latest stock close: `{m.get('latest_stock_date')}`")
          print(f"- rows: `{m.get('rows')}`")
          w = m.get("warnings") or []
          print(f"- warnings: **{len(w)}**")
          for x in w[:15]:
              print(f"  - {x}")
          PY
          else
            echo "- nse_meta.json missing — the fetch did not complete" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the snapshot did not advance
        if: steps.update.outcome != 'success'
        run: |
          echo "auto_update.py exited non-zero."
          echo "Exit 1 = NSE refused the connection (likely runner IP blocked)."
          echo "Exit 2 = fetch ran but data did not advance (exchange holiday, or blocked)."
          echo "If this fails repeatedly, switch to the local scheduler path."
          exit 1
